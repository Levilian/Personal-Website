[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"

# twitter:player iframes /og-player.html on twitter.com, so it cannot keep the
# site-wide DENY. Browsers ignore unrecognized X-Frame-Options values, which
# drops the restriction on this static embed page only.
[[headers]]
  for = "/og-player.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
